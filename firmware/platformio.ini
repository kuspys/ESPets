
[env:hello]
platform = espressif32
framework = arduino
board = esp32dev
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_src_filter = +<hello/>

[env:esp_now]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
build_src_filter = +<esp_now_test/>
monitor_speed = 115200

[env:screen-test]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram = enabled
board_upload.flash_size = 16MB
build_src_filter = +<screen-test/>
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@^2.5.34
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MISO=-1
  -D TFT_MOSI=41
  -D TFT_SCLK=40
  -D TFT_CS=39
  -D TFT_DC=38
  -D TFT_RST=42
  -D USE_FSPI_PORT=1
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1